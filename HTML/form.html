<!DOCTYPE html>
<br lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<br>
    <br action="example registration">
        <label for="name" id="name" >NAME</label>
        <input type="text" id="name" placeholder="enter your name" value="name"><br></br>

        <label for="password" id="password">PASSWORD</label>
        <input type="password" id="password" placeholder="enter your password" value="password"><br></br>

        <label for="email" id="email">enter your email</label>  
        <input type="email" id="email" placeholder="enter email" ><br></br>

        <label for="DOB" id="date of birth">D.O.B</label>
        <input type="date" id="DOB" placeholder="enter your DOB"><br></br>

        <label for="mobile no" id="mobile no">MOBILE NO</label>
        <input type="tel" id="mobile no" placeholder="enter your mobile no"><br></br>

        <h2>select your skills</h2>
        <input type="radio" id="frontened" name="skills" value="frontened">
        <label for="frontened">FRONTENED DEVELEPOR</label><br><br>
        <input type="radio" id="full stack developer" name="skills" value="full stack develepor">
        <label for="full stack develepor" >FULL STACK DEVELOPER</label><br><br>

        <label for="login" id="login" name="login"></label>
        <input type="button" id="login" value="login"><br></br>

        <input type="range" id="volume" name="volume" min="1" max="9" value="volume">
        <label for="volume" id="volume" >volume</label><br></br>

        <label for="file">Choose a profile pic</label>
        <input type="file" id="file" name="file chosen" accept="image/png" accept="image/jpeg">

        <h3>text area element</h3>
        <label for="review" >submit a review</label>
        <input type="text area" id="review" name="review" >

    </form>
</body>
